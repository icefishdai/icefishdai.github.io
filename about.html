<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">


    <title>About Me - Digital Garden</title>


    <style>
        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        body {


            background: #F4F1EA;

            font-family:

                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;


            color: #455044;


            min-height: 100vh;


        }





        .page {


            padding: 60px 10%;

            animation: fade .8s;


        }





        .back {


            position: absolute;

            top: 35px;

            left: 40px;


            text-decoration: none;


            color: #66745f;


            border: 1px solid #B9C5B1;


            padding: 10px 25px;


            border-radius: 30px;


            transition: .3s;


        }



        .back:hover {


            background: #9CAF88;

            color: white;


        }





        .header {


            text-align: center;

            margin-bottom: 50px;


        }



        .header h1 {


            font-size: 42px;

            font-weight: 400;

            letter-spacing: 8px;


        }



        .header p {


            margin-top: 15px;

            color: #8C9984;

            letter-spacing: 3px;


        }






        /*
====================

树结构

====================
*/



        .tree-box {


            height: 520px;


            position: relative;


            display: flex;

            justify-content: center;


        }




        .tree {


            position: relative;

            width: 350px;

            height: 450px;


        }




        .trunk {


            position: absolute;


            bottom: 0;

            left: 50%;


            transform: translateX(-50%);


            height: 250px;


            width: 45px;


            background: #8E765B;


            border-radius: 30px;


        }



        .root {


            position: absolute;


            bottom: 0;


            left: 50%;


            transform: translateX(-50%);


            width: 220px;


            height: 40px;


            border-radius: 50%;


            background: #8E765B;


        }




        .branch {


            position: absolute;

            height: 10px;

            background: #8E765B;

            border-radius: 20px;

            transform-origin: left center;


        }



        .b1 {


            width: 170px;

            top: 160px;

            left: 160px;

            transform: rotate(-35deg);


        }


        .b2 {


            width: 160px;

            top: 210px;

            left: 40px;

            transform: rotate(35deg);


        }


        .b3 {


            width: 130px;

            top: 110px;

            left: 120px;

            transform: rotate(-65deg);


        }




        /* 技能叶子 */


        .skill {


            position: absolute;


            width: 90px;


            height: 90px;


            background: #9CAF88;


            border-radius:

                50% 0 50% 50%;


            display: flex;


            align-items: center;

            justify-content: center;


            font-size: 14px;


            color: white;


            cursor: pointer;


            transition: .4s;


            animation: float 4s infinite;


        }



        .skill:hover {


            transform: scale(1.2) rotate(10deg);


            background: #D9A87E;


        }




        .s1 {

            top: 40px;

            left: 80px;


        }


        .s2 {

            top: 90px;

            right: 20px;


        }


        .s3 {

            top: 180px;

            left: -20px;


        }



        .s4 {

            top: 230px;

            right: -30px;


        }



        .s5 {

            top: 300px;

            left: 80px;


        }




        /*
====================

介绍区域

====================
*/


        .intro {


            margin-top: 50px;


            display: grid;


            grid-template-columns:

                1fr 1fr;


            gap: 50px;


        }




        .card {


            background:

                rgba(255, 255, 255, .45);


            border:

                1px solid #D5DCCF;


            padding: 35px;


            border-radius: 30px;


        }



        .card h2 {


            font-weight: 400;


            margin-bottom: 20px;


            letter-spacing: 3px;


        }




        .card p {


            line-height: 2;


            font-size: 15px;


            color: #66745f;


        }





        /*
时间轴

*/


        .timeline {


            margin-top: 20px;


        }



        .item {


            border-left:

                2px solid #9CAF88;


            padding-left: 25px;


            margin-bottom: 25px;


        }



        .item h3 {


            font-size: 18px;

            font-weight: 400;


        }



        .item span {


            font-size: 13px;


            color: #899681;


        }




        @keyframes float {


            0%,
            100% {

                transform: translateY(0);

            }


            50% {

                transform: translateY(-15px);

            }


        }



        @keyframes fade {


            from {

                opacity: 0;

                transform: translateY(20px);

            }


            to {

                opacity: 1;

            }


        }



        @media(max-width:800px) {


            .intro {

                grid-template-columns: 1fr;

            }


        }
    </style>


</head>




<body>




    <a class="back" href="index.html">

        ← 返回花园

    </a>





    <div class="page">





        <div class="header">


            <h1>

                ABOUT ME

            </h1>


            <p>

                一棵正在成长的数字植物

            </p>



        </div>







        <div class="tree-box">



            <div class="tree">



                <div class="root"></div>


                <div class="trunk"></div>


                <div class="branch b1"></div>

                <div class="branch b2"></div>

                <div class="branch b3"></div>





                <div class="skill s1">

                    剪辑

                </div>



                <div class="skill s2">

                    动画

                </div>



                <div class="skill s3">

                    绘画

                </div>



                <div class="skill s4">

                    3D建模

                </div>



                <div class="skill s5">

                    Web设计

                </div>




            </div>


        </div>







        <div class="intro">





            <div class="card">


                <h2>

                    🌱 我的故事

                </h2>


                <p>


                    我是一名数字媒体技术学生。

                    <br>


                    我喜欢探索不同媒介之间的连接。


                    <br>


                    影像、动画、绘画、三维和网页，

                    都是我表达想法的方式。


                    <br>


                    我希望创造的不只是作品，

                    而是一种能够被体验的视觉空间。


                </p>



            </div>







            <div class="card">


                <h2>

                    🌳 成长路径

                </h2>


                <div class="timeline">



                    <div class="item">


                        <h3>

                            开始探索数字媒体

                        </h3>


                        <span>

                            学习视觉设计与基础创作

                        </span>


                    </div>




                    <div class="item">


                        <h3>

                            接触多种媒介

                        </h3>


                        <span>

                            视频 / 动画 / 3D / Web

                        </span>


                    </div>





                    <div class="item">


                        <h3>

                            建立自己的数字花园

                        </h3>


                        <span>

                            寻找属于自己的创作语言

                        </span>


                    </div>



                </div>


            </div>




        </div>






    </div>







</body>


</html>
