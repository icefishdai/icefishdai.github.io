<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About Me</title>


    <style>
        /* ==================================================
   基础设置
================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #faf7ee;

        }


        /* ==================================================
   整个 About 页面
================================================== */

        .about-page {

            width: 100vw;
            height: 100vh;

            overflow-y: auto;
            overflow-x: hidden;

            scroll-snap-type: y mandatory;

            scroll-behavior: smooth;

        }


        /* ==================================================
   每一个页面部分
================================================== */

        .about-section {

            position: relative;

            width: 100vw;
            height: 100vh;

            min-height: 100vh;

            flex-shrink: 0;

            scroll-snap-align: start;

            overflow: hidden;

        }


        /* ==================================================
   上半部分背景
================================================== */

        .about-top {

            background-image: url("about-top.png");

            background-size: 100% 100%;

            background-position: center;

            background-repeat: no-repeat;

        }


        /* ==================================================
   下半部分背景
================================================== */

        .about-bottom {

            background-image: url("about-bottom.png");

            background-size: 100% 100%;

            background-position: center;

            background-repeat: no-repeat;

        }


        /* ==================================================
   漂浮物
================================================== */

        .floating-object {

            position: fixed;

            z-index: 20;

            pointer-events: none;

            user-select: none;

            object-fit: contain;

            opacity: 1;

        }


        /* ==================================================
   下半部分文字区域
================================================== */

        .about-text {

            position: absolute;

            z-index: 10;

            left: 50%;

            top: 50%;

            transform: translate(-50%, -50%);

            width: 72%;

            max-width: 1100px;

            height: 55%;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

        }


        /* ==================================================
   文字本身
================================================== */

        .about-text p {

            width: 100%;

            max-width: 900px;

            font-family:
                "Microsoft YaHei",
                "Noto Sans SC",
                sans-serif;

            font-size: clamp(16px, 1.35vw, 25px);

            line-height: 2;

            letter-spacing: 0.05em;

            color: #68635d;

            white-space: pre-line;

        }


        /* ==================================================
   手机适配
================================================== */

        @media (max-width: 700px) {

            .about-text {

                width: 70%;

                height: 55%;

            }


            .about-text p {

                font-size: clamp(13px, 3.5vw, 18px);

                line-height: 1.8;

            }

        }


        /* ==================================================
   减少动画设置的用户
================================================== */

        @media (prefers-reduced-motion: reduce) {

            .about-page {

                scroll-behavior: auto;

            }

        }
    </style>

</head>



<body>


    <!-- ==================================================
     整个 About 页面
================================================== -->

    <div class="about-page">


        <!-- ==============================================
         第一部分
    =============================================== -->

        <section class="about-section about-top">

        </section>



        <!-- ==============================================
         第二部分
    =============================================== -->

        <section class="about-section about-bottom">


            <!-- ==========================================
             你的个人介绍文字
        =========================================== -->

            <div class="about-text">

                <p>
                    你好，我是 Icefish。
                    这里可以写你的个人介绍。
                    你可以介绍自己的学习方向、
                    喜欢的创作方式、
                    对设计、影像、AI或者数字媒体的理解。
                    这里也可以写一些比较个人化的内容，
                    让别人通过这个页面认识你。
                    这一部分的文字长度之后可以慢慢调整。
                </p>

            </div>


        </section>


    </div>



    <script>

        /* ==================================================
           漂浮物设置
        ================================================== */


        /*
            如果你只有一个漂浮物：
        
            floating.png
        
            就保持下面这样。
        
            如果以后有多个漂浮物，可以改成：
        
            "floating1.png",
            "floating2.png",
            "floating3.png"
        
            程序会随机使用它们。
        */


        const floatingImages = [

            "floating.png"

        ];



        /*
            漂浮物数量
        
            你可以以后修改这个数字。
        
            例如：
        
            6  = 6个
            10 = 10个
            15 = 15个
        
            我建议先从 8 个左右开始。
        */


        const floatingCount = 11;



        /*
            漂浮物最小尺寸
        
            单位：px
        */


        const minSize = 50;



        /*
            漂浮物最大尺寸
        
            单位：px
        */


        const maxSize = 80;



        /*
            最小移动速度
        
            数字越小越慢
        */


        const minDuration = 18;



        /*
            最大移动速度
        
            数字越大越慢
        
            所以：
        
            18 ~ 35 秒
        
            会让漂浮物非常缓慢地移动。
        */


        const maxDuration = 35;



        /* ==================================================
           创建漂浮物
        ================================================== */

        for (let i = 0; i < floatingCount; i++) {


            const object = document.createElement("img");


            object.classList.add("floating-object");


            /*
                随机选择图片
            */

            const randomImage =
                floatingImages[
                Math.floor(
                    Math.random() * floatingImages.length
                )
                ];


            object.src = randomImage;



            /*
                随机大小
            */

            const size =
                minSize +
                Math.random() *
                (maxSize - minSize);


            object.style.width = size + "px";



            /*
                随机初始位置
        
                留一点边缘空间，
                避免漂浮物刚好贴在屏幕边缘。
            */

            const left =
                Math.random() * 90 + 5;

            const top =
                Math.random() * 90 + 5;


            object.style.left = left + "vw";

            object.style.top = top + "vh";



            /*
                随机移动时间
            */

            const duration =
                minDuration +
                Math.random() *
                (maxDuration - minDuration);



            /*
                随机移动距离
            */

            const moveX =
                (Math.random() * 160) - 80;


            const moveY =
                (Math.random() * 160) - 80;



            /*
                每一个漂浮物生成自己的动画
            */

            const animationName =
                "floatAnimation" + i;



            const style =
                document.createElement("style");



            style.innerHTML = `

        @keyframes ${animationName} {

            0% {

                transform:
                    translate(0px, 0px);

            }

            50% {

                transform:
                    translate(
                        ${moveX}px,
                        ${moveY}px
                    );

            }

            100% {

                transform:
                    translate(0px, 0px);

            }

        }

    `;



            document.head.appendChild(style);



            /*
                设置动画
            */

            object.style.animation =

                `${animationName}
         ${duration}s
         ease-in-out
         infinite`;



            /*
                随机动画起始时间
        
                防止所有漂浮物同时开始移动。
            */

            object.style.animationDelay =

                `-${Math.random() * duration}s`;



            /*
                放入页面
            */

            document.body.appendChild(object);

        }



        /* ==================================================
           鼠标滚轮控制
        ================================================== */


        /*
            这里的功能是：
        
            第一屏向下滚一次
            ↓
            快速进入第二屏
        
        
            第二屏向上滚一次
            ↓
            快速回到第一屏
        
        
            不会让页面停在两个页面之间。
        */


        const page =
            document.querySelector(".about-page");


        const sections =
            document.querySelectorAll(".about-section");


        let currentSection = 0;


        let isScrolling = false;



        page.addEventListener(

            "wheel",

            function (event) {


                /*
                    防止一次滚轮产生很多次跳转
                */

                if (isScrolling) {

                    event.preventDefault();

                    return;

                }



                /*
                    向下滚动
                */

                if (event.deltaY > 0) {

                    if (
                        currentSection
                        <
                        sections.length - 1
                    ) {

                        currentSection++;

                    }

                }



                /*
                    向上滚动
                */

                else if (event.deltaY < 0) {

                    if (
                        currentSection
                        >
                        0
                    ) {

                        currentSection--;

                    }

                }



                /*
                    如果没有发生页面变化，
                    就不执行动画。
                */

                if (
                    currentSection ===
                    Math.round(
                        page.scrollTop /
                        window.innerHeight
                    )
                ) {

                    return;

                }



                isScrolling = true;



                /*
                    滚动到目标部分
                */

                sections[currentSection].scrollIntoView({

                    behavior: "smooth",

                    block: "start"

                });



                /*
                    防止连续滚动
        
                    700ms之后允许再次滚动。
                */

                setTimeout(function () {

                    isScrolling = false;

                }, 700);


                /*
                    阻止浏览器原本的滚动
                */

                event.preventDefault();

            },

            {
                passive: false
            }

        );

    </script>


</body>

</html>
